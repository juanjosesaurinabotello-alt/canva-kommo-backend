<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d9650"/><stop offset="1" stop-color="#4a8040"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#3fb6d6"/><stop offset="0.7" stop-color="#1f86b0"/><stop offset="1" stop-color="#0e5f86"/>
    </radialGradient>
    <linearGradient id="bld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/><stop offset="1" stop-color="#d9d3c6"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- terreno -->
  <rect width="1280" height="800" fill="url(#grass)"/>

  <!-- areas verdes textura sutil -->
  <g opacity="0.12" stroke="#2f5a28" stroke-width="2">
    <line x1="0" y1="120" x2="1280" y2="90"/><line x1="0" y1="300" x2="1280" y2="330"/>
    <line x1="0" y1="520" x2="1280" y2="560"/><line x1="0" y1="700" x2="1280" y2="680"/>
  </g>

  <!-- titulo -->
  <text x="40" y="56" fill="#ffffff" font-size="30" font-weight="800" letter-spacing="3">ATLANTICO</text>
  <text x="40" y="80" fill="#bfe3ff" font-size="14" letter-spacing="5">SPLASH PARK · RESORT — esquema de la escena 3D</text>

  <!-- PARQUE ACUATICO -->
  <ellipse cx="340" cy="430" rx="250" ry="210" fill="#e9d9a8"/>
  <ellipse cx="340" cy="430" rx="180" ry="150" fill="url(#pool)"/>
  <g fill="none" stroke="#bfeaf7" stroke-width="3" opacity="0.5">
    <ellipse cx="340" cy="430" rx="120" ry="100"/><ellipse cx="340" cy="430" rx="70" ry="58"/>
  </g>
  <!-- toboganes -->
  <g filter="url(#sh)">
    <path d="M150 250 q60 30 30 120" fill="none" stroke="#ff5e5e" stroke-width="14" stroke-linecap="round"/>
    <path d="M185 240 q60 35 35 130" fill="none" stroke="#5ec8ff" stroke-width="14" stroke-linecap="round"/>
    <path d="M220 235 q65 35 35 140" fill="none" stroke="#ffd15e" stroke-width="14" stroke-linecap="round"/>
    <rect x="142" y="230" width="14" height="40" rx="3" fill="#cfcfcf"/>
    <rect x="177" y="220" width="14" height="40" rx="3" fill="#cfcfcf"/>
    <rect x="212" y="215" width="14" height="40" rx="3" fill="#cfcfcf"/>
  </g>
  <text x="340" y="435" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle" opacity="0.9">PARQUE ACUÁTICO</text>

  <!-- RESORT 1 -->
  <g filter="url(#sh)">
    <rect x="820" y="250" width="320" height="170" rx="6" fill="url(#bld)"/>
    <!-- bandas de vidrio (pisos) -->
    <g fill="#8fbcdc" opacity="0.85">
      <rect x="828" y="270" width="304" height="16"/><rect x="828" y="300" width="304" height="16"/>
      <rect x="828" y="330" width="304" height="16"/><rect x="828" y="360" width="304" height="16"/>
      <rect x="828" y="390" width="304" height="16"/>
    </g>
  </g>
  <text x="980" y="240" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">RESORT 1 · Unidades en venta</text>

  <!-- HOTSPOTS de unidad (color = disponibilidad) -->
  <g font-size="11" font-weight="700" text-anchor="middle">
    <g><circle cx="860" cy="300" r="15" fill="#2ecc71" stroke="#fff" stroke-width="3"/><text x="860" y="304" fill="#fff">⌂</text><text x="860" y="335" fill="#fff" font-size="10">101</text></g>
    <g><circle cx="940" cy="330" r="15" fill="#2ecc71" stroke="#fff" stroke-width="3"/><text x="940" y="334" fill="#fff">⌂</text><text x="940" y="365" fill="#fff" font-size="10">102</text></g>
    <g><circle cx="1020" cy="300" r="15" fill="#f1c40f" stroke="#fff" stroke-width="3"/><text x="1020" y="304" fill="#fff">⌂</text><text x="1020" y="335" fill="#fff" font-size="10">103</text></g>
    <g><circle cx="900" cy="385" r="15" fill="#e74c3c" stroke="#fff" stroke-width="3"/><text x="900" y="389" fill="#fff">⌂</text><text x="900" y="420" fill="#fff" font-size="10">104</text></g>
    <g><circle cx="1080" cy="365" r="15" fill="#2ecc71" stroke="#fff" stroke-width="3"/><text x="1080" y="369" fill="#fff">⌂</text><text x="1080" y="400" fill="#fff" font-size="10">105</text></g>
  </g>

  <!-- accesos / camino -->
  <rect x="950" y="420" width="60" height="300" fill="#3f3f47"/>
  <g stroke="#f2c200" stroke-width="3" stroke-dasharray="14 14"><line x1="980" y1="430" x2="980" y2="715"/></g>
  <text x="1040" y="640" fill="#ffffff" font-size="15" font-weight="700" opacity="0.9">ACCESOS / ESTAC.</text>

  <!-- palmeras -->
  <g>
    <g transform="translate(620,180)"><circle r="9" fill="#2e7d32"/><circle r="4" fill="#8a5a2b"/></g>
    <g transform="translate(700,520)"><circle r="9" fill="#2e7d32"/><circle r="4" fill="#8a5a2b"/></g>
    <g transform="translate(560,640)"><circle r="9" fill="#2e7d32"/><circle r="4" fill="#8a5a2b"/></g>
    <g transform="translate(160,560)"><circle r="9" fill="#2e7d32"/><circle r="4" fill="#8a5a2b"/></g>
    <g transform="translate(770,300)"><circle r="9" fill="#2e7d32"/><circle r="4" fill="#8a5a2b"/></g>
    <g transform="translate(1180,470)"><circle r="9" fill="#2e7d32"/><circle r="4" fill="#8a5a2b"/></g>
    <g transform="translate(640,690)"><circle r="9" fill="#2e7d32"/><circle r="4" fill="#8a5a2b"/></g>
    <g transform="translate(120,180)"><circle r="9" fill="#2e7d32"/><circle r="4" fill="#8a5a2b"/></g>
  </g>

  <!-- LEYENDA -->
  <g transform="translate(40,640)" font-size="13" fill="#ffffff">
    <rect x="-10" y="-26" width="250" height="120" rx="10" fill="#0b1220" opacity="0.55"/>
    <text x="0" y="-6" font-weight="700">Disponibilidad de unidades</text>
    <circle cx="8" cy="16" r="7" fill="#2ecc71"/><text x="24" y="20">Disponible</text>
    <circle cx="8" cy="40" r="7" fill="#f1c40f"/><text x="24" y="44">Reservada</text>
    <circle cx="8" cy="64" r="7" fill="#e74c3c"/><text x="24" y="68">Vendida</text>
  </g>

  <!-- UI: MENU inferior -->
  <g transform="translate(355,742)">
    <rect x="0" y="0" width="570" height="44" rx="14" fill="#0b1220" opacity="0.82"/>
    <g fill="#e9f1fb" font-size="13" text-anchor="middle">
      <text x="70" y="27">🚶 Recorrido libre</text>
      <text x="190" y="27">🚁 Vista aérea</text>
      <text x="310" y="27">🎬 Guiado</text>
      <text x="405" y="27">🏠 Unidades</text>
      <text x="500" y="27">🌅 Atardecer</text>
    </g>
  </g>

  <!-- UI: FICHA de unidad (mock) -->
  <g transform="translate(980,470)" filter="url(#sh)">
    <rect x="0" y="0" width="270" height="250" rx="14" fill="#0f1726"/>
    <rect x="0" y="0" width="270" height="90" rx="14" fill="#16324f"/>
    <text x="20" y="50" fill="#bfe3ff" font-size="13">RESORT 1 · Unidad modelo</text>
    <rect x="20" y="104" width="92" height="22" rx="11" fill="#173e2a"/>
    <text x="30" y="120" fill="#2ecc71" font-size="11" font-weight="700">DISPONIBLE</text>
    <text x="20" y="152" fill="#ffffff" font-size="17" font-weight="700">Penthouse 3 dorm.</text>
    <text x="20" y="180" fill="#9fb0c4" font-size="11">ÁREA</text><text x="20" y="196" fill="#fff" font-size="14" font-weight="600">128 m²</text>
    <text x="150" y="180" fill="#9fb0c4" font-size="11">PRECIO</text><text x="150" y="196" fill="#0a84ff" font-size="14" font-weight="700">USD 395.000</text>
    <rect x="20" y="210" width="230" height="30" rx="8" fill="#0a84ff"/>
    <text x="135" y="230" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Me interesa</text>
  </g>
</svg>
